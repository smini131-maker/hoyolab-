name: Build Galaxy Store Auto Attendance APK

on:
  push:
    branches:
      - build/galaxy-store-auto-attendance-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate standard Gradle Wrapper
        run: gradle -p GalaxyStoreAutoAttendance wrapper --gradle-version 8.13

      - name: Build debug APK through wrapper
        working-directory: GalaxyStoreAutoAttendance
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStoreAutoAttendance-debug
          path: GalaxyStoreAutoAttendance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete Android Studio project
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyStoreAutoAttendance-project
          path: |
            GalaxyStoreAutoAttendance/**
            !GalaxyStoreAutoAttendance/.gradle/**
            !GalaxyStoreAutoAttendance/app/build/**
          if-no-files-found: error
          retention-days: 7
