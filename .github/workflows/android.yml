name: Android 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew clean testDebugUnitTest --no-daemon --max-workers=1

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon --max-workers=1

      - name: APK 빌드
        run: ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon --max-workers=1

      - name: 테스트 보고서 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
